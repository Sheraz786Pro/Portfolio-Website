<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | Taylor Swift</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Simple header for navigation -->
  <header>
    <h1>Let's Connect</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <!-- Contact Form Section -->
  <section class="about">
    <h2>Got something to share?</h2>
    <p>I’d love to hear from you! Whether it’s about music, a project, or just to say hi — feel free to drop a message below.</p>

    <!-- Basic contact form -->
    <form action="thankyou.html" method="GET" class="contact-form">

      <label for="name">Name:</label><br />
      <input type="text" id="name" name="name" required /><br /><br />

      <label for="email">Email:</label><br />
      <input type="email" id="email" name="email" required /><br /><br />

      <label for="message">Message:</label><br />
      <textarea id="message" name="message" rows="5" required></textarea><br /><br />

      <button type="submit">Send Message</button>
    </form>
  </section>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 With love, Taylor 💖</p>
  </footer>
</body>
</html>
